name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node test (24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check js/plugins/TT_ChatChoice.js

      - name: Core tests (49)
        run: node tools/test-core.mjs
